name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs (rapid pushes to the same branch/PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-ubuntu:
    uses: ./.github/workflows/tests.yml
    with:
      os: ubuntu-latest
      lint: true
  tests-windows:
    uses: ./.github/workflows/tests.yml
    with:
      os: windows-latest
  tests-macos:
    uses: ./.github/workflows/tests.yml
    with:
      os: macos-latest
